# Cabeçalhos de segurança HTTP. Pendência do item 8 da auditoria de
# 31/08/2026: o FastAPI não devolve nenhum deles (comportamento normal do
# Starlette), e a auditoria concluiu que o lugar certo é aqui, no proxy que
# termina a borda do frontend.
#
# ══════════════════════════════════════════════════════════════════════════
# ⚠️ POR QUE ISTO É UM ARQUIVO SEPARADO, E NÃO UM BLOCO NO `server`
# ══════════════════════════════════════════════════════════════════════════
#
# A regra de herança do `add_header` no nginx é uma armadilha clássica:
#
#   "These directives are inherited from the previous configuration level
#    if and only if there are NO add_header directives defined on the
#    current level."
#
# Ou seja: bastaria UM `add_header Cache-Control ...` dentro de um `location`
# — e o template tem dois, em `/assets/` e em `/` — pra que TODOS os
# cabeçalhos de segurança definidos no nível `server` fossem descartados
# naquelas rotas. O resultado seria o pior tipo de falha de segurança: os
# cabeçalhos presentes na resposta que você testa à mão (`curl /health`) e
# ausentes justamente no HTML e no JavaScript, que é onde eles protegem.
#
# Com um arquivo incluído explicitamente em cada `location`, não há herança
# pra dar errado. O preço é repetir um `include`; o preço da outra opção é
# descobrir isso num pentest.
#
# `always` faz o cabeçalho valer também nas respostas de erro (4xx/5xx) —
# sem ele, um 404 sairia sem proteção nenhuma.

# Impede o navegador de "adivinhar" o tipo do conteúdo. Sem isto, um arquivo
# servido como text/plain que contenha HTML pode ser interpretado como HTML.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking. `frame-ancestors` da CSP abaixo é o mecanismo moderno e mais
# completo; este continua aqui pra navegadores que ainda não o respeitam.
add_header X-Frame-Options "DENY" always;

# Não vaza a URL interna (ex.: /leads/123) pra sites externos. Um clique num
# link de saída manda só a origem, nunca o caminho.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Desliga APIs do navegador que este produto não usa. Se um dia alguma tela
# precisar de alguma, é aqui que se libera.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# ⚠️ HSTS — força HTTPS por 1 ano.
#
# SEM `includeSubDomains` e SEM `preload`, de propósito: o domínio é um
# subdomínio de `4handsai.com.br`, compartilhado com os outros clientes do
# HunterPro. `includeSubDomains` num irmão poderia forçar HTTPS em serviços
# vizinhos que talvez ainda não tenham certificado, e `preload` é
# praticamente irreversível (sai da lista dos navegadores em meses, não em
# minutos).
#
# ⚠️ Só faz efeito quando servido sobre HTTPS, e o EasyPanel termina o TLS na
# borda (aqui dentro é HTTP puro). Se a borda já mandar o próprio HSTS, o
# navegador verá dois — inofensivo, mas vale conferir e remover a duplicata.
add_header Strict-Transport-Security "max-age=31536000" always;

# ══════════════════════════════════════════════════════════════════════════
# Content-Security-Policy — montada a partir do que o bundle REALMENTE usa
# ══════════════════════════════════════════════════════════════════════════
#
# Conferido contra `dist/` construído em 31/08/2026, não escrito de memória:
#
#   script-src 'self'      O `index.html` do Vite carrega o bundle por
#                          `<script type="module" src>`; não há script inline,
#                          nem `eval`, nem `dangerouslySetInnerHTML` no
#                          código (conferido com grep). Aqui é onde a CSP
#                          realmente protege, e por isso fica estrita.
#
#   style-src ... 'unsafe-inline'
#                          ⚠️ O relaxamento consciente. O `index.html` puxa
#                          Google Fonts (Bebas Neue + Inter) de
#                          fonts.googleapis.com, e o app tem 3 usos de
#                          `style={{...}}` — atributo `style` inline é
#                          bloqueado por `style-src` sem `unsafe-inline`, e a
#                          tela quebraria visualmente. Estilo inline é um
#                          vetor muito mais fraco que script inline; o que
#                          importa manter estrito é o `script-src`.
#
#   font-src ...           As fontes em si vêm de fonts.gstatic.com.
#
#   img-src 'self' data:   O bundle embute SVGs pequenos como data: URI.
#
#   connect-src 'self'     Em produção a API é servida pela MESMA origem
#                          (VITE_API_URL vazio → URLs relativas → proxy
#                          `/api/` deste nginx). Se um dia o backend for pra
#                          outro domínio, é ESTA linha que precisa mudar —
#                          junto com o FRONTEND_ORIGIN do backend.
#
#   frame-ancestors 'none' Ninguém embute esta app num iframe.
#   base-uri / object-src / form-action: fecham vetores que o app não usa.
#
# Os links `wa.me` e `mailto:` do dossiê são NAVEGAÇÃO (abrem outra aba), não
# requisição — nenhuma diretiva de CSP os bloqueia, não precisam de entrada.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
